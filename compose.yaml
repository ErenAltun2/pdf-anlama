services:
  app:
    image: erenaltun/pdf-anlama:latest
    pull_policy: always
    ports:
      - "8501:8501"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      VLM_PROVIDER: ${VLM_PROVIDER:-gemini}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:3b}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      VLM_MIN_GAP_SECONDS: ${VLM_MIN_GAP_SECONDS:-4.0}
    volumes:
      - pdf-anlama-outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pdf-anlama-outputs:
